<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pedido confirmado · AnotherLevelDecants</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Jost', sans-serif; background: #f9f6f1; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 2rem; }
    .box { text-align: center; padding: 3rem 2rem; max-width: 600px; background: #fff; border: 1px solid #e8e4df; border-radius: 8px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 300; color: #1a1a1a; margin-bottom: 1rem; }
    p { color: #6b6b6b; line-height: 1.7; margin-bottom: 2rem; }
    .dev-notice { background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px; padding: 1rem; margin: 2rem 0; text-align: left; color: #856404; font-size: 0.9rem; }
    .order-summary { text-align: left; background: #fafaf7; border: 1px solid #e8e4df; border-radius: 4px; padding: 1.5rem; margin: 2rem 0; }
    .order-item { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid #e8e4df; }
    .order-item:last-child { border-bottom: none; }
    .order-total { display: flex; justify-content: space-between; padding: 1rem 0; font-weight: 500; font-size: 1.1rem; border-top: 2px solid #c9a96e; margin-top: 1rem; }
    a { color: #c9a96e; text-decoration: none; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 1px solid #c9a96e; padding-bottom: 2px; display: inline-block; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>✦ Pedido confirmado</h1>
    <p>Gracias por tu compra. Recibirás un email de confirmación y prepararemos tu pedido artesanalmente con mucho cariño.</p>
    
    <div id="order-info" style="display: none;">
      <div class="dev-notice">
        <strong>Nota de desarrollo:</strong> Este es un resumen de prueba. En producción se procesará el pago con Stripe.
      </div>
      <div class="order-summary" id="order-summary"></div>
    </div>
    
    <a href="/">Volver al catálogo</a>
  </div>

  <script>
    // Limpiar carrito al llegar aquí
    localStorage.removeItem('cart')

    // Si hay datos en sessionStorage (en desarrollo), mostrarlos
    const checkoutItems = sessionStorage.getItem('checkoutItems')
    if (checkoutItems) {
      try {
        const items = JSON.parse(checkoutItems)
        const orderInfo = document.getElementById('order-info')
        const orderSummary = document.getElementById('order-summary')
        
        let html = ''
        let total = 0
        
        items.forEach(item => {
          const subtotal = item.price * item.qty
          total += subtotal
          const priceStr = (item.price).toFixed(2).replace('.', ',')
          const subtotalStr = (subtotal).toFixed(2).replace('.', ',')
          html += `
            <div class="order-item">
              <div>
                <strong>${item.brand}</strong><br/>
                ${item.name} (${item.isPack ? 'Pack' : item.size + ' ml'})
              </div>
              <div>
                ${item.qty} x ${priceStr}€ = <strong>${subtotalStr}€</strong>
              </div>
            </div>
          `
        })
        
        html += `<div class="order-total"><span>Total:</span><span>${(total).toFixed(2).replace('.', ',')}</span>€`
        orderSummary.innerHTML = html
        orderInfo.style.display = 'block'
        
        // Limpiar sessionStorage
        sessionStorage.removeItem('checkoutItems')
        sessionStorage.removeItem('checkoutCoupon')
      } catch (e) {
        console.error('Error parsing checkout items:', e)
      }
    }
  </script>
</body>
</html>
